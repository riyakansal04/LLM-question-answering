[pytest]
# Pytest configuration for cricket inference tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for categorizing tests
markers =
    unit: Unit tests (no dependencies)
    integration: Integration tests (may need running service)
    slow: Slow tests (model loading, inference)
    requires_model: Tests that require model to be loaded

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage options
# Uncomment to enable coverage reporting
# addopts = --cov=service --cov=agents --cov-report=html
