# ServiceAccount
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cricket-inference.serviceAccountName" . }}
  labels:
    {{- include "cricket-inference.labels" . | nindent 4 }}

# Secret for HF_TOKEN (must be pre-created by operator)
---
apiVersion: v1
kind: Secret
metadata:
  name: hf-secret
  labels:
    {{- include "cricket-inference.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Populate this with actual HF_TOKEN during deployment
  token: "token-here-replace-with-actual-token"

# Deployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cricket-inference.fullname" . }}
  labels:
    {{- include "cricket-inference.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cricket-inference.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cricket-inference.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "cricket-inference.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      containers:
      - name: cricket-inference
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        
        ports:
        - name: http
          containerPort: {{ .Values.containerPort }}
          protocol: TCP
        
        # Environment variables
        env:
        {{- range .Values.env }}
        - name: {{ .name }}
          {{- if .value }}
          value: {{ .value | quote }}
          {{- else if .valueFrom }}
          valueFrom:
            {{- toYaml .valueFrom | nindent 14 }}
          {{- end }}
        {{- end }}
        
        # Health probes
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 12 }}
        
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 12 }}
        
        # Resource limits
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        
        # Volume mounts
        {{- if .Values.persistence.enabled }}
        volumeMounts:
        - name: models
          mountPath: {{ .Values.persistence.mountPath }}
        {{- end }}
      
      {{- if .Values.persistence.enabled }}
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: {{ include "cricket-inference.fullname" . }}-pvc
      {{- end }}
      
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

# Service
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cricket-inference.fullname" . }}
  labels:
    {{- include "cricket-inference.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "cricket-inference.selectorLabels" . | nindent 4 }}

# PersistentVolumeClaim (if persistence enabled)
{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cricket-inference.fullname" . }}-pvc
  labels:
    {{- include "cricket-inference.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  storageClassName: {{ .Values.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}

# HorizontalPodAutoscaler (if autoscaling enabled)
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "cricket-inference.fullname" . }}
  labels:
    {{- include "cricket-inference.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "cricket-inference.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}

# PodDisruptionBudget (if enabled)
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cricket-inference.fullname" . }}
  labels:
    {{- include "cricket-inference.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "cricket-inference.selectorLabels" . | nindent 6 }}
{{- end }}

# Ingress (if enabled)
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cricket-inference.fullname" . }}
  labels:
    {{- include "cricket-inference.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "cricket-inference.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}

